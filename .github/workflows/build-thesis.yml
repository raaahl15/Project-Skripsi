# Compiles the LaTeX thesis on every push that touches thesis/, so the PDF
# is available even when editing from a phone/iPad (Actions > run > Artifacts).
name: Build thesis PDF

on:
  push:
    paths:
      - "thesis/**"
      - ".github/workflows/build-thesis.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: thesis
          latexmk_use_lualatex: false

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: skripsi-pdf
          path: thesis/main.pdf
          retention-days: 30
